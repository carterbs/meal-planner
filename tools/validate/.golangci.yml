run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - gofumpt
    - revive
    - errcheck
    - ineffassign
    - misspell
    - unparam
    - gosec
    - gocyclo
    - goconst
    - goimports
    - gocritic

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: false
  
  gosec:
    excludes:
      - G104 # Errors unhandled - we handle this with errcheck
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - commentedOutCode
      - whyNoLint

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - goconst
    
    # Exclude known linter issues
    - text: "weak cryptographic primitive"
      linters:
        - gosec

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true