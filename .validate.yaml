services:
  - name: ui
    type: node
    dir: "./ui"
    test: "yarn test --silent"
    lint: "yarn lint --quiet"
    build: "yarn build"

  - name: agent-service
    type: node
    dir: "./agent-service"
    test: "yarn test --silent"
    lint: "yarn lint --quiet"
    build: "yarn build"

  - name: mcp-service
    type: node
    dir: "./mcp-service"
    test: "yarn test --silent"
    lint: "yarn lint --quiet"
    build: "yarn build"

  - name: meal-service
    type: go
    dir: "./meal-service"
    test:
      cmd: "go test ./... -cover -json"
      coverage_profile: "coverage.out"
    lint:
      cmd: "golangci-lint run --out-format json"
    build:
      cmd: "go build ./..."
    min_coverage: 80



