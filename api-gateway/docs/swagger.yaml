basePath: /api
definitions:
  _go.AbandonWorkflowResponse:
    properties:
      message:
        type: string
    type: object
  _go.AddBulkStepsRequest:
    properties:
      instructions:
        items:
          type: string
        type: array
      meal_id:
        type: integer
    type: object
  _go.AddBulkStepsResponse:
    properties:
      steps:
        items:
          $ref: '#/definitions/_go.Step'
        type: array
    type: object
  _go.AddMessageRequest:
    properties:
      message:
        type: string
      sender:
        description: '"user" or "agent"'
        type: string
      thread_id:
        type: string
    type: object
  _go.AddMessageResponse:
    properties:
      message:
        type: string
    type: object
  _go.AddStepRequest:
    properties:
      meal_id:
        type: integer
      step:
        $ref: '#/definitions/_go.Step'
    type: object
  _go.AddStepResponse:
    properties:
      step:
        $ref: '#/definitions/_go.Step'
    type: object
  _go.AgentCheckpoint:
    properties:
      next:
        items:
          type: string
        type: array
      state:
        $ref: '#/definitions/_go.MealPlanningCheckpointState'
      step:
        type: integer
    type: object
  _go.AgentCheckpointMetadata:
    properties:
      source:
        type: string
      step:
        type: integer
    type: object
  _go.AgentMessageRequest:
    properties:
      from:
        type: string
      interactive:
        type: boolean
      message:
        type: string
      thread_id:
        type: string
    type: object
  _go.AgentResponse:
    properties:
      current_step:
        type: string
      initial_state:
        description: JSON string
        type: string
      message:
        type: string
      raw:
        description: JSON string
        type: string
      success:
        type: boolean
      thread_id:
        type: string
    type: object
  _go.AgentStartRequest:
    properties:
      participants:
        items:
          type: string
        type: array
      workflow_type:
        type: string
    type: object
  _go.CancelWorkflowResponse:
    properties:
      status:
        type: string
    type: object
  _go.CheckpointEntry:
    properties:
      checkpoint_ns:
        type: string
      thread_id:
        type: string
      tuple:
        $ref: '#/definitions/_go.CheckpointTuple'
    type: object
  _go.CheckpointTuple:
    properties:
      checkpoint:
        $ref: '#/definitions/_go.AgentCheckpoint'
      metadata:
        $ref: '#/definitions/_go.AgentCheckpointMetadata'
    type: object
  _go.CreateMealIngredientRequest:
    properties:
      ingredient:
        $ref: '#/definitions/_go.Ingredient'
      meal_id:
        type: integer
    type: object
  _go.CreateMealIngredientResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.CreateMealRequest:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.CreateMealResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.DeleteAllStepsResponse:
    properties:
      message:
        type: string
    type: object
  _go.DeleteMealIngredientResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.DeleteMealResponse:
    properties:
      message:
        type: string
    type: object
  _go.DeleteStepResponse:
    properties:
      message:
        type: string
    type: object
  _go.FeedbackEntryProto:
    properties:
      from:
        description: '"user" or agent id'
        type: string
      meal_plan_version:
        type: integer
      message:
        type: string
      timestamp:
        $ref: '#/definitions/timestamppb.Timestamp'
    type: object
  _go.FinalizeMealPlanRequest:
    properties:
      thread_id:
        type: string
    type: object
  _go.FinalizeMealPlanResponse:
    properties:
      message:
        type: string
    type: object
  _go.GenerateMealPlanResponse:
    properties:
      plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
    type: object
  _go.GetAllMealsResponse:
    properties:
      meals:
        items:
          $ref: '#/definitions/_go.Meal'
        type: array
    type: object
  _go.GetCheckpointResponse:
    properties:
      found:
        type: boolean
      tuple:
        $ref: '#/definitions/_go.CheckpointTuple'
    type: object
  _go.GetMealPlanResponse:
    properties:
      plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
    type: object
  _go.GetMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/_go.Message'
        type: array
    type: object
  _go.GetShoppingListRequest:
    properties:
      plan:
        description: meal IDs
        items:
          type: integer
        type: array
    type: object
  _go.GetShoppingListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/_go.ShoppingListItem'
        type: array
    type: object
  _go.GetStepsResponse:
    properties:
      steps:
        items:
          $ref: '#/definitions/_go.Step'
        type: array
    type: object
  _go.GetWorkflowStateResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/_go.Message'
        type: array
      plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
      shopping_list:
        $ref: '#/definitions/_go.ShoppingList'
    type: object
  _go.GetWorkflowStatusResponse:
    properties:
      status:
        $ref: '#/definitions/_go.WorkflowStatus'
    type: object
  _go.HealthCheckResponse:
    properties:
      message:
        type: string
      services:
        additionalProperties:
          type: boolean
        type: object
      status:
        type: string
    type: object
  _go.Ingredient:
    properties:
      id:
        type: integer
      meal_id:
        type: integer
      name:
        type: string
      quantity:
        type: number
      unit:
        type: string
    type: object
  _go.ListCheckpointsResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/_go.CheckpointEntry'
        type: array
    type: object
  _go.ListWorkflowsResponse:
    properties:
      workflows:
        items:
          $ref: '#/definitions/_go.WorkflowStatus'
        type: array
    type: object
  _go.Meal:
    properties:
      effort:
        type: integer
      has_red_meat:
        type: boolean
      id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/_go.Ingredient'
        type: array
      last_planned:
        $ref: '#/definitions/timestamppb.Timestamp'
      meal_type:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/_go.Step'
        type: array
      url:
        type: string
    type: object
  _go.MealPlanEntry:
    properties:
      day_index:
        type: integer
      meal:
        $ref: '#/definitions/_go.Meal'
      meal_type:
        type: string
    type: object
  _go.MealPlanningCheckpointState:
    properties:
      created_at:
        $ref: '#/definitions/timestamppb.Timestamp'
      current_step:
        type: string
      feedback_history:
        items:
          $ref: '#/definitions/_go.FeedbackEntryProto'
        type: array
      is_finalized:
        type: boolean
      iteration_count:
        type: integer
      meal_plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
      participants:
        items:
          type: string
        type: array
      shopping_list:
        $ref: '#/definitions/_go.ShoppingList'
      thread_id:
        type: string
      updated_at:
        $ref: '#/definitions/timestamppb.Timestamp'
    type: object
  _go.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      sender:
        description: '"user" or "agent"'
        type: string
      thread_id:
        type: string
    type: object
  _go.MessageAgentRequest:
    properties:
      request:
        $ref: '#/definitions/_go.AgentMessageRequest'
    type: object
  _go.MessageAgentResponse:
    properties:
      response:
        $ref: '#/definitions/_go.AgentResponse'
    type: object
  _go.PutCheckpointRequest:
    properties:
      checkpoint:
        $ref: '#/definitions/_go.AgentCheckpoint'
      checkpoint_ns:
        type: string
      metadata:
        $ref: '#/definitions/_go.AgentCheckpointMetadata'
      thread_id:
        type: string
      workflow_type:
        type: string
    type: object
  _go.PutCheckpointResponse:
    properties:
      checkpoint_ns:
        type: string
      success:
        type: boolean
      thread_id:
        type: string
    type: object
  _go.ReconnectResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  _go.ReorderStepsRequest:
    properties:
      meal_id:
        type: integer
      step_ids:
        items:
          type: integer
        type: array
    type: object
  _go.ReorderStepsResponse:
    properties:
      message:
        type: string
    type: object
  _go.ReplaceMealRequest:
    properties:
      day:
        type: string
      new_meal_id:
        type: integer
    type: object
  _go.ReplaceMealResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.ShoppingList:
    properties:
      items:
        items:
          $ref: '#/definitions/_go.ShoppingListItem'
        type: array
    type: object
  _go.ShoppingListItem:
    properties:
      category:
        type: string
      ingredient:
        type: string
      quantity:
        type: string
    type: object
  _go.StartAgentWorkflowRequest:
    properties:
      request:
        $ref: '#/definitions/_go.AgentStartRequest'
    type: object
  _go.StartAgentWorkflowResponse:
    properties:
      response:
        $ref: '#/definitions/_go.AgentResponse'
    type: object
  _go.Step:
    properties:
      id:
        type: integer
      instruction:
        type: string
      meal_id:
        type: integer
      step_number:
        type: integer
    type: object
  _go.SwapMealRequest:
    properties:
      meal_id:
        type: integer
      meal_type:
        type: string
    type: object
  _go.SwapMealResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.UpdateMealIngredientRequest:
    properties:
      ingredient:
        $ref: '#/definitions/_go.Ingredient'
      ingredient_id:
        type: integer
      meal_id:
        type: integer
    type: object
  _go.UpdateMealIngredientResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.UpdateMealRequest:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
      meal_id:
        type: integer
    type: object
  _go.UpdateMealResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.UpdateSessionStateRequest:
    properties:
      current_step:
        type: string
      meal_plan:
        description: JSON string
        type: string
      shopping_list:
        description: JSON string
        type: string
      status:
        type: string
      thread_id:
        type: string
    type: object
  _go.UpdateSessionStateResponse:
    properties:
      message:
        type: string
    type: object
  _go.UpdateStepRequest:
    properties:
      meal_id:
        type: integer
      step:
        $ref: '#/definitions/_go.Step'
      step_id:
        type: integer
    type: object
  _go.UpdateStepResponse:
    properties:
      step:
        $ref: '#/definitions/_go.Step'
    type: object
  _go.WeeklyMealPlan:
    properties:
      days:
        items:
          $ref: '#/definitions/_go.MealPlanEntry'
        type: array
      shopping_list:
        items:
          $ref: '#/definitions/_go.ShoppingListItem'
        type: array
    type: object
  _go.WorkflowStatus:
    properties:
      current_step:
        type: string
      participants:
        items:
          type: string
        type: array
      thread_id:
        type: string
      workflow_type:
        type: string
    type: object
  main.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  timestamppb.Timestamp:
    properties:
      nanos:
        description: |-
          Non-negative fractions of a second at nanosecond resolution. Negative
          second values with fractions must still have non-negative nanos values
          that count forward in time. Must be from 0 to 999,999,999
          inclusive.
        type: integer
      seconds:
        description: |-
          Represents seconds of UTC time since Unix epoch
          1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to
          9999-12-31T23:59:59Z inclusive.
        type: integer
    type: object
host: localhost:8090
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API Gateway for Meal Planner service
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Meal Planner API Gateway
  version: "1.0"
paths:
  /agent/message:
    post:
      consumes:
      - application/json
      description: Send a message to an existing agent workflow
      parameters:
      - description: Agent message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.MessageAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message sent successfully
          schema:
            $ref: '#/definitions/_go.MessageAgentResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Message Agent
      tags:
      - agent
  /agent/start:
    post:
      consumes:
      - application/json
      description: Start a new agent workflow for meal planning
      parameters:
      - description: Agent start request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.StartAgentWorkflowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Agent workflow started successfully
          schema:
            $ref: '#/definitions/_go.StartAgentWorkflowResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Start Agent Workflow
      tags:
      - agent
  /agent/status/{threadId}:
    get:
      consumes:
      - application/json
      description: Get the status of an agent workflow
      parameters:
      - description: Thread ID
        in: path
        name: threadId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Workflow status retrieved successfully
          schema:
            $ref: '#/definitions/_go.GetWorkflowStatusResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Workflow Status
      tags:
      - agent
  /agent/workflows:
    get:
      consumes:
      - application/json
      description: List all active workflows
      produces:
      - application/json
      responses:
        "200":
          description: Workflows listed successfully
          schema:
            $ref: '#/definitions/_go.ListWorkflowsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List Workflows
      tags:
      - agent
  /agent/workflows/{threadId}:
    delete:
      consumes:
      - application/json
      description: Cancel an active workflow
      parameters:
      - description: Thread ID
        in: path
        name: threadId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Workflow cancelled successfully
          schema:
            $ref: '#/definitions/_go.CancelWorkflowResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Cancel Workflow
      tags:
      - agent
  /checkpoints:
    get:
      consumes:
      - application/json
      description: List all checkpoints
      parameters:
      - description: Limit number of results
        in: query
        name: limit
        type: integer
      - description: Before thread ID for pagination
        in: query
        name: before_thread_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoints listed successfully
          schema:
            $ref: '#/definitions/_go.ListCheckpointsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List Checkpoints
      tags:
      - checkpoint
    post:
      consumes:
      - application/json
      description: Save a checkpoint
      parameters:
      - description: Put checkpoint request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.PutCheckpointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoint saved successfully
          schema:
            $ref: '#/definitions/_go.PutCheckpointResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Put Checkpoint
      tags:
      - checkpoint
  /checkpoints/{thread_id}:
    get:
      consumes:
      - application/json
      description: Get a checkpoint by thread ID
      parameters:
      - description: Thread ID
        in: path
        name: thread_id
        required: true
        type: string
      - description: Checkpoint namespace
        in: query
        name: checkpoint_ns
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoint retrieved successfully
          schema:
            $ref: '#/definitions/_go.GetCheckpointResponse'
        "404":
          description: Checkpoint not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Checkpoint
      tags:
      - checkpoint
  /health:
    get:
      consumes:
      - application/json
      description: Check the health status of the API gateway and all backend services
      produces:
      - application/json
      responses:
        "200":
          description: Health check successful
          schema:
            $ref: '#/definitions/_go.HealthCheckResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Health Check
      tags:
      - health
  /mealplan:
    get:
      consumes:
      - application/json
      description: Get the current meal plan
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan retrieved successfully
          schema:
            $ref: '#/definitions/_go.GetMealPlanResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Meal Plan
      tags:
      - mealplan
  /mealplan/finalize:
    post:
      consumes:
      - application/json
      description: Finalize the current meal plan
      parameters:
      - description: Finalize meal plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.FinalizeMealPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan finalized successfully
          schema:
            $ref: '#/definitions/_go.FinalizeMealPlanResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Finalize Meal Plan
      tags:
      - mealplan
  /mealplan/generate:
    post:
      consumes:
      - application/json
      description: Generate a new meal plan
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan generated successfully
          schema:
            $ref: '#/definitions/_go.GenerateMealPlanResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Generate Meal Plan
      tags:
      - mealplan
  /mealplan/ics:
    get:
      consumes:
      - application/json
      description: Get meal plan as ICS calendar file
      produces:
      - text/calendar
      responses:
        "200":
          description: ICS calendar file
          schema:
            type: file
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Meal Plan ICS
      tags:
      - mealplan
  /mealplan/replace:
    post:
      consumes:
      - application/json
      description: Replace a meal in the plan
      parameters:
      - description: Replace meal request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.ReplaceMealRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meal replaced successfully
          schema:
            $ref: '#/definitions/_go.ReplaceMealResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Replace Meal
      tags:
      - meals
  /meals:
    get:
      consumes:
      - application/json
      description: Get all available meals
      parameters:
      - description: Meal type filter
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Meals retrieved successfully
          schema:
            $ref: '#/definitions/_go.GetAllMealsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get All Meals
      tags:
      - meals
    post:
      consumes:
      - application/json
      description: Create a new meal
      parameters:
      - description: Create meal request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.CreateMealRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Meal created successfully
          schema:
            $ref: '#/definitions/_go.CreateMealResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create Meal
      tags:
      - meals
  /meals/{mealId}:
    delete:
      consumes:
      - application/json
      description: Delete a meal
      parameters:
      - description: Meal ID
        in: path
        name: mealId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Meal deleted successfully
          schema:
            $ref: '#/definitions/_go.DeleteMealResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Delete Meal
      tags:
      - meals
    put:
      consumes:
      - application/json
      description: Update an existing meal's properties (name, effort, meal type,
        etc.)
      parameters:
      - description: Meal ID
        in: path
        name: mealId
        required: true
