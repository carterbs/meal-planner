basePath: /api
definitions:
  _go.AddBulkStepsRequest:
    properties:
      instructions:
        items:
          type: string
        type: array
      meal_id:
        type: integer
    type: object
  _go.AddMessageRequest:
    properties:
      message:
        type: string
      sender:
        description: '"user" or "agent"'
        type: string
      thread_id:
        type: string
    type: object
  _go.AddStepRequest:
    properties:
      meal_id:
        type: integer
      step:
        $ref: '#/definitions/_go.Step'
    type: object
  _go.AgentCheckpoint:
    properties:
      next:
        items:
          type: string
        type: array
      state:
        $ref: '#/definitions/_go.MealPlanningCheckpointState'
      step:
        type: integer
    type: object
  _go.AgentCheckpointMetadata:
    properties:
      source:
        type: string
      step:
        type: integer
    type: object
  _go.CreateMealIngredientRequest:
    properties:
      ingredient:
        $ref: '#/definitions/_go.Ingredient'
      meal_id:
        type: integer
    type: object
  _go.CreateMealIngredientResponse:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.CreateMealRequest:
    properties:
      meal:
        $ref: '#/definitions/_go.Meal'
    type: object
  _go.FeedbackEntryProto:
    properties:
      from:
        description: '"user" or agent id'
        type: string
      meal_plan_version:
        type: integer
      message:
        type: string
      timestamp:
        $ref: '#/definitions/timestamppb.Timestamp'
    type: object
  _go.FinalizeMealPlanRequest:
    properties:
      plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
    type: object
  _go.GetShoppingListRequest:
    properties:
      plan:
        description: meal IDs
        items:
          type: integer
        type: array
    type: object
  _go.Ingredient:
    properties:
      id:
        type: integer
      meal_id:
        type: integer
      name:
        type: string
      quantity:
        type: number
      unit:
        type: string
    type: object
  _go.Meal:
    properties:
      effort:
        type: integer
      has_red_meat:
        type: boolean
      id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/_go.Ingredient'
        type: array
      last_planned:
        $ref: '#/definitions/timestamppb.Timestamp'
      meal_type:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/_go.Step'
        type: array
      url:
        type: string
    type: object
  _go.MealPlanEntry:
    properties:
      day_index:
        type: integer
      meal:
        $ref: '#/definitions/_go.Meal'
      meal_type:
        type: string
    type: object
  _go.MealPlanningCheckpointState:
    properties:
      created_at:
        $ref: '#/definitions/timestamppb.Timestamp'
      current_step:
        type: string
      feedback_history:
        items:
          $ref: '#/definitions/_go.FeedbackEntryProto'
        type: array
      is_finalized:
        type: boolean
      iteration_count:
        type: integer
      meal_plan:
        $ref: '#/definitions/_go.WeeklyMealPlan'
      participants:
        items:
          type: string
        type: array
      shopping_list:
        $ref: '#/definitions/_go.ShoppingList'
      thread_id:
        type: string
      updated_at:
        $ref: '#/definitions/timestamppb.Timestamp'
    type: object
  _go.PutCheckpointRequest:
    properties:
      checkpoint:
        $ref: '#/definitions/_go.AgentCheckpoint'
      checkpoint_ns:
        type: string
      metadata:
        $ref: '#/definitions/_go.AgentCheckpointMetadata'
      thread_id:
        type: string
      workflow_type:
        type: string
    type: object
  _go.ReorderStepsRequest:
    properties:
      meal_id:
        type: integer
      step_ids:
        items:
          type: integer
        type: array
    type: object
  _go.ReplaceMealRequest:
    properties:
      day:
        type: string
      new_meal_id:
        type: integer
    type: object
  _go.SaveMealPlanRequest:
    properties:
      entries:
        items:
          $ref: '#/definitions/_go.MealPlanEntry'
        type: array
      thread_id:
        type: string
      version:
        type: integer
    type: object
  _go.ShoppingList:
    properties:
      items:
        items:
          $ref: '#/definitions/_go.ShoppingListItem'
        type: array
    type: object
  _go.ShoppingListItem:
    properties:
      category:
        type: string
      ingredient:
        type: string
      quantity:
        type: string
    type: object
  _go.Step:
    properties:
      id:
        type: integer
      instruction:
        type: string
      meal_id:
        type: integer
      step_number:
        type: integer
    type: object
  _go.SwapMealRequest:
    properties:
      meal_id:
        type: integer
      meal_type:
        type: string
    type: object
  _go.UpdateMealIngredientRequest:
    properties:
      ingredient:
        $ref: '#/definitions/_go.Ingredient'
      ingredient_id:
        type: integer
      meal_id:
        type: integer
    type: object
  _go.UpdateSessionStateRequest:
    properties:
      current_step:
        type: string
      meal_plan:
        description: JSON string
        type: string
      shopping_list:
        description: JSON string
        type: string
      status:
        type: string
      thread_id:
        type: string
    type: object
  _go.UpdateStepRequest:
    properties:
      meal_id:
        type: integer
      step:
        $ref: '#/definitions/_go.Step'
      step_id:
        type: integer
    type: object
  _go.WeeklyMealPlan:
    properties:
      days:
        items:
          $ref: '#/definitions/_go.MealPlanEntry'
        type: array
      shopping_list:
        items:
          $ref: '#/definitions/_go.ShoppingListItem'
        type: array
    type: object
  main.AgentMessageRequestBody:
    properties:
      from:
        type: string
      interactive:
        type: boolean
      message:
        type: string
      threadId:
        type: string
    type: object
  main.AgentMessageResponse:
    properties:
      response:
        $ref: '#/definitions/main.AgentResponseBody'
    type: object
  main.AgentResponseBody:
    properties:
      currentStep:
        type: string
      initialState:
        type: string
      message:
        type: string
      success:
        type: boolean
      threadId:
        type: string
    type: object
  main.AgentStartRequestBody:
    properties:
      participants:
        items:
          type: string
        type: array
      workflowType:
        type: string
    type: object
  main.AgentStartResponse:
    properties:
      response:
        $ref: '#/definitions/main.AgentResponseBody'
    type: object
  main.CheckpointListResponse:
    properties:
      entries:
        items:
          properties:
            checkpointNs:
              type: string
            threadId:
              type: string
            tuple:
              $ref: '#/definitions/main.CheckpointTupleResponse'
          type: object
        type: array
    type: object
  main.CheckpointResponse:
    properties:
      found:
        type: boolean
      tuple:
        properties:
          checkpoint:
            properties:
              state:
                properties:
                  currentStep:
                    type: string
                  mealPlan:
                    properties:
                      days:
                        items:
                          $ref: '#/definitions/main.MealPlanEntryResponse'
                        type: array
                    type: object
                  participants:
                    items:
                      type: string
                    type: array
                  threadId:
                    type: string
                type: object
            type: object
        type: object
    type: object
  main.CheckpointTupleResponse:
    properties:
      checkpoint:
        properties:
          state:
            properties:
              currentStep:
                type: string
              mealPlan:
                properties:
                  days:
                    items:
                      $ref: '#/definitions/main.MealPlanEntryResponse'
                    type: array
                type: object
              participants:
                items:
                  type: string
                type: array
              threadId:
                type: string
            type: object
        type: object
    type: object
  main.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  main.GetMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/main.MessageResponse'
        type: array
    type: object
  main.HealthResponse:
    properties:
      message:
        type: string
      services:
        additionalProperties:
          type: boolean
        type: object
      status:
        type: string
    type: object
  main.IngredientResponse:
    properties:
      id:
        type: integer
      mealId:
        type: integer
      name:
        type: string
      quantity:
        type: number
      unit:
        type: string
    type: object
  main.MealPlanEntryResponse:
    properties:
      dayIndex:
        type: integer
      meal:
        $ref: '#/definitions/main.MealResponse'
      mealType:
        type: string
    type: object
  main.MealPlanResponse:
    properties:
      plan:
        properties:
          days:
            items:
              $ref: '#/definitions/main.MealPlanEntryResponse'
            type: array
          shoppingList:
            items:
              $ref: '#/definitions/main.ShoppingListItemResponse'
            type: array
        type: object
    type: object
  main.MealResponse:
    properties:
      effort:
        type: integer
      hasRedMeat:
        type: boolean
      id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/main.IngredientResponse'
        type: array
      mealType:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/main.StepResponse'
        type: array
      url:
        type: string
    type: object
  main.MealsResponse:
    properties:
      meals:
        items:
          $ref: '#/definitions/main.MealResponse'
        type: array
    type: object
  main.MessageResponse:
    properties:
      content:
        type: string
      createdAt:
        type: string
      sender:
        type: string
      threadId:
        type: string
    type: object
  main.ShoppingListItemResponse:
    properties:
      category:
        type: string
      ingredient:
        type: string
      quantity:
        type: string
    type: object
  main.ShoppingListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/main.ShoppingListItemResponse'
        type: array
    type: object
  main.SimpleMessageResponse:
    properties:
      message:
        type: string
    type: object
  main.StepResponse:
    properties:
      id:
        type: integer
      instruction:
        type: string
      mealId:
        type: integer
      stepNumber:
        type: integer
    type: object
  main.StepsResponse:
    properties:
      steps:
        items:
          $ref: '#/definitions/main.StepResponse'
        type: array
    type: object
  main.WorkflowMessageResponse:
    properties:
      content:
        type: string
      createdAt:
        type: string
      sender:
        type: string
      threadId:
        type: string
    type: object
  main.WorkflowStateResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/main.WorkflowMessageResponse'
        type: array
      plan:
        properties:
          days:
            items:
              $ref: '#/definitions/main.MealPlanEntryResponse'
            type: array
        type: object
      shoppingList:
        properties:
          items:
            items:
              $ref: '#/definitions/main.ShoppingListItemResponse'
            type: array
        type: object
    type: object
  main.WorkflowStatusResponse:
    properties:
      status:
        properties:
          currentStep:
            type: string
          participants:
            items:
              type: string
            type: array
          threadId:
            type: string
          workflowType:
            type: string
        type: object
    type: object
  main.WorkflowsResponse:
    properties:
      workflows:
        items:
          $ref: '#/definitions/main.WorkflowStatusResponse'
        type: array
    type: object
  timestamppb.Timestamp:
    properties:
      nanos:
        description: |-
          Non-negative fractions of a second at nanosecond resolution. Negative
          second values with fractions must still have non-negative nanos values
          that count forward in time. Must be from 0 to 999,999,999
          inclusive.
        type: integer
      seconds:
        description: |-
          Represents seconds of UTC time since Unix epoch
          1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to
          9999-12-31T23:59:59Z inclusive.
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API Gateway for Meal Planner service
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Meal Planner API Gateway
  version: "1.0"
paths:
  /agent/message:
    post:
      consumes:
      - application/json
      description: Send a message to an existing agent workflow
      parameters:
      - description: Agent message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.AgentMessageRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: Message sent successfully
          schema:
            $ref: '#/definitions/main.AgentMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Message Agent
      tags:
      - agent
  /agent/start:
    post:
      consumes:
      - application/json
      description: Start a new agent workflow for meal planning
      parameters:
      - description: Agent start request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.AgentStartRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: Agent workflow started successfully
          schema:
            $ref: '#/definitions/main.AgentStartResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Start Agent Workflow
      tags:
      - agent
  /agent/status/{threadId}:
    get:
      consumes:
      - application/json
      description: Get the status of an agent workflow
      parameters:
      - description: Thread ID
        in: path
        name: threadId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Workflow status retrieved successfully
          schema:
            $ref: '#/definitions/main.WorkflowStatusResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Workflow Status
      tags:
      - agent
  /agent/workflows:
    get:
      consumes:
      - application/json
      description: List all active workflows
      produces:
      - application/json
      responses:
        "200":
          description: Workflows listed successfully
          schema:
            $ref: '#/definitions/main.WorkflowsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List Workflows
      tags:
      - agent
  /agent/workflows/{threadId}:
    delete:
      consumes:
      - application/json
      description: Cancel an active workflow
      parameters:
      - description: Thread ID
        in: path
        name: threadId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Workflow cancelled successfully
          schema:
            $ref: '#/definitions/main.SimpleMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Cancel Workflow
      tags:
      - agent
  /checkpoints:
    get:
      consumes:
      - application/json
      description: List all checkpoints
      parameters:
      - description: Limit number of results
        in: query
        name: limit
        type: integer
      - description: Before thread ID for pagination
        in: query
        name: before_thread_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoints listed successfully
          schema:
            $ref: '#/definitions/main.CheckpointListResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List Checkpoints
      tags:
      - checkpoint
    post:
      consumes:
      - application/json
      description: Save a checkpoint
      parameters:
      - description: Put checkpoint request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.PutCheckpointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoint saved successfully
          schema:
            $ref: '#/definitions/main.SimpleMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Put Checkpoint
      tags:
      - checkpoint
  /checkpoints/{thread_id}:
    get:
      consumes:
      - application/json
      description: Get a checkpoint by thread ID
      parameters:
      - description: Thread ID
        in: path
        name: thread_id
        required: true
        type: string
      - description: Checkpoint namespace
        in: query
        name: checkpoint_ns
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Checkpoint retrieved successfully
          schema:
            $ref: '#/definitions/main.CheckpointResponse'
        "404":
          description: Checkpoint not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Checkpoint
      tags:
      - checkpoint
  /health:
    get:
      consumes:
      - application/json
      description: Check the health status of the API gateway and all backend services
      produces:
      - application/json
      responses:
        "200":
          description: Health check successful
          schema:
            $ref: '#/definitions/main.HealthResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Health Check
      tags:
      - health
  /mealplan:
    get:
      consumes:
      - application/json
      description: Get the current meal plan
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan retrieved successfully
          schema:
            $ref: '#/definitions/main.MealPlanResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Meal Plan
      tags:
      - mealplan
    post:
      consumes:
      - application/json
      description: Save the current meal plan
      parameters:
      - description: Save meal plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.SaveMealPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan saved successfully
          schema:
            $ref: '#/definitions/main.SimpleMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "501":
          description: Not implemented
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Save Meal Plan
      tags:
      - mealplan
  /mealplan/finalize:
    post:
      consumes:
      - application/json
      description: Finalize the current meal plan
      parameters:
      - description: Finalize meal plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.FinalizeMealPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan finalized successfully
          schema:
            $ref: '#/definitions/main.SimpleMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Finalize Meal Plan
      tags:
      - mealplan
  /mealplan/generate:
    post:
      consumes:
      - application/json
      description: Generate a new meal plan
      produces:
      - application/json
      responses:
        "200":
          description: Meal plan generated successfully
          schema:
            $ref: '#/definitions/main.MealPlanResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Generate Meal Plan
      tags:
      - mealplan
  /mealplan/ics:
    get:
      consumes:
      - application/json
      description: Get meal plan as ICS calendar file
      produces:
      - text/calendar
      responses:
        "200":
          description: ICS calendar file
          schema:
            type: file
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get Meal Plan ICS
      tags:
      - mealplan
  /mealplan/replace:
    post:
      consumes:
      - application/json
      description: Replace a meal in the plan
      parameters:
      - description: Replace meal request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.ReplaceMealRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Meal replaced successfully
          schema:
            $ref: '#/definitions/main.MealResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Replace Meal
      tags:
      - meals
  /meals:
    get:
      consumes:
      - application/json
      description: Get all available meals
      parameters:
      - description: Meal type filter
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Meals retrieved successfully
          schema:
            $ref: '#/definitions/main.MealsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get All Meals
      tags:
      - meals
    post:
      consumes:
      - application/json
      description: Create a new meal
      parameters:
      - description: Create meal request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/_go.CreateMealRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Meal created successfully
          schema:
            $ref: '#/definitions/main.MealResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create Meal
      tags:
      - meals
  /meals/{mealId}:
    delete:
      consumes:
      - application/json
      description: Delete a meal
      parameters:
      - description: Meal ID
        in: path
        name: mealId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Meal deleted successfully
          schema:
            $ref: '#/definitions/main.SimpleMessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Delete Meal
      tags:
      - meals
  /meals/{mealId}/ingredients:
    post:
      consumes:
      - application/json
      description: Add a new ingredient to a meal
