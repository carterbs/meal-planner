version: '3.8'

services:
  # Nginx proxy to maintain compatibility while backend moves to 8090
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    # Override the ports to not expose 8090 externally since nginx will proxy
    ports: []